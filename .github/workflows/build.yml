name: Test and build Windows client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest test_app -v
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YouTubeDownloadAssistant app.py
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloadAssistant-windows-x64
          path: dist/YouTubeDownloadAssistant.exe
          if-no-files-found: error
